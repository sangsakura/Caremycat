<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>咕噜罐头管家 FINAL 3.2</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f6fb;color:#29273a;font-family:-apple-system,"PingFang SC",sans-serif;padding-bottom:76px}header{background:linear-gradient(135deg,#6c5ce7,#967cf0);color:#fff;padding:20px 16px}header h1{margin:0}.wrap{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 12px #29273a0d}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.kpi{background:#f0eefc;border-radius:13px;padding:11px}.kpi b{font-size:23px;display:block}.muted{color:#77758a;font-size:12px}.item{padding:11px;border-bottom:1px solid #eee}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}button,.btn{border:0;border-radius:11px;padding:10px 12px;background:#6c5ce7;color:#fff;font-weight:700}button.sec,.btn.sec{background:#efedfb;color:#5c49c8}button.bad{background:#ffe3e8;color:#a52d40}input,select{width:100%;padding:10px;border:1px solid #ddd8eb;border-radius:10px;font:inherit}label{display:block;margin:8px 0 4px;font-size:12px;color:#77758a}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #eee}.tabs button{flex:1;background:#fff;color:#777;border-radius:0;font-size:11px;padding:9px 2px}.tabs button.on{color:#6c5ce7}.page{display:none}.page.on{display:block}.day,.open{background:#faf9ff;border:1px solid #e8e5f3;border-radius:13px;padding:11px;margin:8px 0}.new{border-left:5px solid #db891e}.warn{background:#fff4de;padding:9px;border-radius:9px;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:flex-end}.modal.on{display:flex}.sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:17px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.pack{width:64px;height:78px;border-radius:9px 9px 14px 14px;background:linear-gradient(145deg,#fff,#e9e4ff);border:1px solid #d9d0f4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;box-shadow:inset 0 7px 0 #c9bdf2;font-size:9px;color:#4a397e;flex:none}.pack b{font-size:10px}.withpack{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center}.pill{font-size:11px;background:#eeeafb;color:#5948bd;padding:4px 8px;border-radius:30px}@media(min-width:700px){.tabs{max-width:760px;left:50%;transform:translateX(-50%)}.sheet{max-width:700px;margin:auto}}</style></head><body><header><h1>🐱 咕噜罐头管家</h1><div>FINAL 3.2 · 完整库存、开罐轮换、实际摄入、7天/30天磷负荷</div></header><main class="wrap"><section id="home" class="page on"><div class="grid"><div class="kpi"><b id="stockN">0</b><span>未开封库存</span></div><div class="kpi"><b id="openN">0/2</b><span>当前已开</span></div></div><div class="card"><div class="row between"><h2>今日建议</h2><button class="sec" onclick="plan()">重算</button></div><div id="today"></div><button style="width:100%" onclick="showEat()">记录实际摄入</button></div><div class="card"><div class="row between"><h2>已开罐</h2><button onclick="showOpen()">＋开罐</button></div><div id="opens"></div></div><div class="warn">每周打开2–3种，可轮换或同日混合；普通罐开封后14天内吃完，可冷冻。实际摄入后自动扣余量并重算。</div></section><section id="plans" class="page"><div class="card"><h2>7天 / 30天磷负荷</h2><div class="grid"><div class="kpi"><b id="p7">--</b><span>滚动7天</span><div id="c7" class="muted"></div></div><div class="kpi"><b id="p30">--</b><span>滚动30天</span><div id="c30" class="muted"></div></div></div></div><div class="card"><h2>未来30天</h2><div id="days"></div></div></section><section id="inv" class="page"><div class="card"><div class="row between"><h2>库存</h2><button onclick="showAdd()">＋入库</button></div><input id="q" placeholder="搜索品牌/口味" oninput="render()"><div id="inventory"></div></div></section><section id="hist" class="page"><div class="card"><h2>实际摄入与流水</h2><div id="history"></div></div></section><section id="set" class="page"><div class="card"><h2>设置</h2><label>每日湿粮目标(g)</label><input id="target" type="number"><label>开罐期限(天)</label><input id="maxDays" type="number"><label>每7天新开最少/最多品种</label><div class="grid"><input id="wmin" type="number"><input id="wmax" type="number"></div><label>同时已开上限</label><input id="maxOpen" type="number"><button style="width:100%;margin-top:12px" onclick="saveSet()">保存并重算</button></div><div class="card"><h2>数据管理</h2><div class="actions"><button onclick="backup()">导出备份</button><label class="btn sec" style="text-align:center;margin:0">导入JSON/TXT<input type="file" hidden accept=".json,.txt" onchange="load(event)"></label><button class="bad" onclick="reset()">恢复内置数据</button></div></div></section></main><nav class="tabs"><button class="on" data-p="home">🥫<br>今日</button><button data-p="plans">📅<br>30天</button><button data-p="inv">📦<br>库存</button><button data-p="hist">✍️<br>记录</button><button data-p="set">⚙️<br>设置</button></nav><div id="openM" class="modal"><div class="sheet"><h2>打开新罐</h2><label>品项</label><select id="openSku"></select><label>开罐重量(g)</label><input id="openG" type="number"><label><input id="freeze" type="checkbox" style="width:auto"> 已分装冷冻</label><div class="actions"><button onclick="openSave()">确认</button><button class="sec" onclick="cm('openM')">取消</button></div></div></div><div id="eatM" class="modal"><div class="sheet"><h2>记录实际摄入</h2><label>日期</label><input id="eatDate" type="date"><label>已开罐</label><select id="eatOpen"></select><label>实际克数</label><input id="eatG" type="number"><label>备注</label><input id="note"><div class="actions"><button onclick="eatSave()">保存并重算</button><button class="sec" onclick="cm('eatM')">取消</button></div></div></div><div id="addM" class="modal"><div class="sheet"><h2>新增库存</h2><label>品牌</label><input id="brand"><label>口味/名称</label><input id="food"><label>规格(g)</label><input id="size" type="number"><label>数量</label><input id="qty" type="number" value="1"><label>kcal/100g</label><input id="kcal" type="number"><label>磷 mg/1000kcal</label><input id="phos" type="number"><label>等级</label><select id="grade"><option>G1</option><option>G2</option><option>G3</option><option>G4</option><option selected>GX</option></select><div class="actions"><button onclick="addSave()">保存</button><button class="sec" onclick="cm('addM')">取消</button></div></div></div><script>
const K='gulu-complete-final-32',T=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'}),A=(s,n)=>{let d=new Date(s+'T12:00:00+08:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'})},U=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);const seed=[['cf403','凯姿','403鸡肉',85,23,95,1597,'G1'],['cf409','凯姿','409火鸡鸡兔',85,11,95,1531,'G1'],['cf413','凯姿','413鸡肉吞拿鱼',85,9,95,1520,'G1'],['gp5','交响乐','No.5纯鸡',200,6,110,2487,'G4'],['gp8','交响乐','No.8雉鸡鸭鸡',200,5,110,2653,'G4'],['gp9','交响乐','No.9雉鸡兔',200,4,110,2653,'G4'],['gp3','交响乐','No.3野味鸡',200,1,110,2485,'G4'],['mjam','喵吖喵','老年多汁鸡',400,1,103,2677,'G4'],['wild','王尔德','炖兔和鸡',180,5,null,null,'GX'],['pur','德金','鸡肉野猪',200,1,104,1860,'G2'],['ven','蔚安迪','鸡兔',400,1,105,2262,'G3'],['betty','老奶奶','雪境纯鸡',200,8,null,null,'GX'],['leon','小李子','鸡肉菠菜',200,5,null,null,'GX']];function def(){return{set:{target:80,maxDays:14,wmin:2,wmax:3,maxOpen:2},cat:Object.fromEntries(seed.map(x=>[x[0],{id:x[0],brand:x[1],name:x[2],size:x[3],kcal:x[5],p:x[6],grade:x[7]}])),batches:seed.map(x=>({id:U(),sku:x[0],g:x[3],n:x[4]})),open:[],logs:[],tx:[],plan:[]}}let S=JSON.parse(localStorage.getItem(K)||'null')||def();function sv(){localStorage.setItem(K,JSON.stringify(S))}function nm(id){let x=S.cat[id]||{brand:'未识别',name:id};return x.brand+' · '+x.name}function active(){return S.open.filter(x=>x.left>.5)}function groups(){let o={};S.batches.filter(x=>x.n>0).forEach(x=>{let k=x.sku+'|'+x.g;if(!o[k])o[k]={sku:x.sku,g:x.g,n:0};o[k].n+=x.n});return Object.values(o)}function deduct(id,g){let x=S.batches.find(x=>x.sku===id&&+x.g===+g&&x.n>0);if(!x)return false;x.n--;return true}function nut(id,g){let x=S.cat[id]||{},cal=x.kcal?g*x.kcal/100:null;return{cal,pm:cal&&x.p?cal*x.p/1000:null}}function metric(logs,end,n){let st=A(end,-n+1),kc=0,tc=0,pm=0,ug=0,tg=0;logs.filter(x=>x.date>=st&&x.date<=end).forEach(x=>{let z=nut(x.sku,+x.g);tg+=+x.g;if(z.cal){tc+=z.cal;if(z.pm){kc+=z.cal;pm+=z.pm}else ug+=+x.g}else ug+=+x.g});return{load:kc?pm/kc*1000:null,cov:tc?kc/tc:(tg?0:null),ug}}function plan(){let os=active().map(x=>({...x})),stock=groups().map(x=>({...x})),logs=S.logs.map(x=>({...x})),out=[];for(let i=0;i<30;i++){let date=A(T(),i),need=S.set.target,eat=[],opened=[];os.sort((a,b)=>a.due.localeCompare(b.due)||a.left-b.left);for(const o of os){if(need<=0)break;let take=Math.min(need,o.left);o.left-=take;need-=take;eat.push({sku:o.sku,g:take})}os=os.filter(x=>x.left>.5);let recent=S.open.filter(x=>x.opened>=A(date,-6)&&x.opened<=date).length+opened.length;if((need>0||recent<S.set.wmin)&&os.length<S.set.maxOpen&&recent<S.set.wmax){let recentSku=new Set(logs.filter(l=>l.date>=A(date,-6)&&l.date<=date).map(l=>l.sku));let recentSmall=logs.filter(l=>l.date>=A(date,-6)&&l.date<=date&&(S.cat[l.sku]||{}).size===85).reduce((a,l)=>a+l.g,0);let g4Cal=logs.filter(l=>l.date>=A(date,-29)&&l.date<=date&&(S.cat[l.sku]||{}).grade==='G4').reduce((a,l)=>a+(nut(l.sku,l.g).cal||0),0);let totalCal=logs.filter(l=>l.date>=A(date,-29)&&l.date<=date).reduce((a,l)=>a+(nut(l.sku,l.g).cal||0),0);let cand=stock.filter(x=>x.n>0).sort((a,b)=>score(a)-score(b))[0];function score(c){let x=S.cat[c.sku]||{},z=0;if(x.grade==='GX')z+=700;if(x.grade==='G4'){z+=250;if(totalCal&&g4Cal/totalCal>.18)z+=5000}if(c.g===85){z+=650;if(recentSmall>=170)z+=6000}else if(c.g>=180&&c.g<=220)z-=350;else if(c.g>=300)z-=180;if(recentSku.has(c.sku))z+=900;z-=Math.min(c.n,10)*25;let test=[...logs,{date,sku:c.sku,g:Math.min(need||S.set.target,c.g)}],m7=metric(test,date,7),m30=metric(test,date,30);if(m7.load)z+=Math.abs(m7.load-1800)*1.4;if(m30.load)z+=Math.abs(m30.load-1800)*.8;return z}if(cand){cand.n--;let o={id:'v'+U(),sku:cand.sku,left:cand.g,opened:date,due:A(date,S.set.maxDays-1),frozen:true};os.push(o);opened.push({sku:o.sku,g:cand.g});if(need>0){let take=Math.min(need,o.left);o.left-=take;need-=take;eat.push({sku:o.sku,g:take})}}}eat.forEach(x=>logs.push({date,sku:x.sku,g:x.g}));os=os.filter(x=>x.left>.5);out.push({date,eat,opened,missing:need,m7:metric(logs,date,7),m30:metric(logs,date,30)})}S.plan=out;sv();render()}function pack(id){let x=S.cat[id]||{brand:'待补',name:id};let c=x.grade==='G1'?'#d9f5e8':x.grade==='G2'?'#e2efff':x.grade==='G3'?'#fff0cf':x.grade==='G4'?'#ffe0e6':'#eee';return `<div class="pack" style="background:${c}"><b>${x.brand}</b><span>${x.name}</span><small>${x.size||''}g · ${x.grade||'GX'}</small></div>`}function render(){stockN.textContent=S.batches.reduce((a,x)=>a+Math.max(0,x.n),0);openN.textContent=active().length+'/'+S.set.maxOpen;let p=S.plan[0];today.innerHTML=p?(p.opened.map(x=>`<div class="day new withpack">${pack(x.sku)}<div><b>建议开：${nm(x.sku)}</b><div>${x.g}g · ${(S.cat[x.sku]||{}).grade||'GX'}</div></div></div>`).join('')+p.eat.map(x=>`<div class="day">吃 ${Math.round(x.g)}g · ${nm(x.sku)}</div>`).join('')):'暂无计划';opens.innerHTML=active().length?active().map(x=>`<div class="open withpack">${pack(x.sku)}<div><b>${nm(x.sku)}</b><div>剩${Math.round(x.left)}g · ${x.due}前 · ${x.frozen?'❄️已冷冻':'未冷冻'}</div></div></div>`).join(''):'<p class="muted">暂无已开罐</p>';let all=[...S.logs,...S.plan.flatMap(p=>p.eat.map(x=>({date:p.date,sku:x.sku,g:x.g})))],m7=metric(all,A(T(),6),7),m30=metric(all,A(T(),29),30);p7.textContent=m7.load?Math.round(m7.load):'--';p30.textContent=m30.load?Math.round(m30.load):'--';c7.textContent='覆盖率 '+(m7.cov==null?'--':Math.round(m7.cov*100)+'%');c30.textContent='覆盖率 '+(m30.cov==null?'--':Math.round(m30.cov*100)+'%');days.innerHTML=S.plan.map(x=>`<div class="day ${x.opened.length?'new':''}"><div class="row between"><b>${x.date}</b><span class="pill">${x.opened.length?'新开'+x.opened.length:'用已开'}</span></div>${x.opened.map(y=>`<div>开：${nm(y.sku)} ${y.g}g</div>`).join('')}${x.eat.map(y=>`<div class="muted">吃${Math.round(y.g)}g · ${nm(y.sku)} · ${(S.cat[y.sku]||{}).grade||'GX'}</div>`).join('')}</div>`).join('');let qq=(q.value||'').toLowerCase();inventory.innerHTML=groups().filter(x=>nm(x.sku).toLowerCase().includes(qq)).map(x=>`<div class="item row between"><div class="withpack" style="flex:1">${pack(x.sku)}<div><b>${nm(x.sku)}</b><div class="muted">${x.g}g · ${(S.cat[x.sku]||{}).grade||'GX'} · ${(S.cat[x.sku]||{}).p||'磷未知'}</div><div class="muted">SKU识别卡，包装实拍待补</div></div></div><b>${x.n}</b></div>`).join('');history.innerHTML=[...S.logs.map(x=>({...x,type:'实际摄入'})),...S.tx].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="item"><b>${x.date} · ${x.type||''}</b><div>${nm(x.sku)} · ${x.g||''}g</div><div class="muted">${x.note||''}</div></div>`).join('')||'暂无记录';target.value=S.set.target;maxDays.value=S.set.maxDays;wmin.value=S.set.wmin;wmax.value=S.set.wmax;maxOpen.value=S.set.maxOpen}function showOpen(){if(active().length>=S.set.maxOpen)return alert('已达同时已开上限');let a=groups();openSku.innerHTML=a.map(x=>`<option value="${x.sku}|${x.g}">${nm(x.sku)}｜${x.g}g｜余${x.n}</option>`).join('');openG.value=a[0]?.g||'';openM.classList.add('on')}openSku.onchange=()=>openG.value=openSku.value.split('|')[1];function openSave(){let [id,g]=openSku.value.split('|');g=+g;if(!deduct(id,g))return alert('库存不足');S.open.push({id:U(),sku:id,left:+openG.value||g,opened:T(),due:A(T(),S.set.maxDays-1),frozen:freeze.checked});S.tx.push({date:T(),type:'开罐',sku:id,g:+openG.value||g});cm('openM');plan()}function showEat(){let a=active();if(!a.length)return alert('请先开罐');eatOpen.innerHTML=a.map(x=>`<option value="${x.id}">${nm(x.sku)}｜剩${Math.round(x.left)}g</option>`).join('');eatDate.value=T();eatG.value=Math.min(S.set.target,a[0].left);eatM.classList.add('on')}function eatSave(){let o=S.open.find(x=>x.id===eatOpen.value),g=+eatG.value;if(!o||g<=0||g>o.left)return alert('克数无效');o.left-=g;S.logs.push({date:eatDate.value,sku:o.sku,g,note:note.value});cm('eatM');plan()}function showAdd(){addM.classList.add('on')}function addSave(){let id='custom-'+U();S.cat[id]={id,brand:brand.value,name:food.value,size:+size.value,kcal:+kcal.value||null,p:+phos.value||null,grade:grade.value};S.batches.push({id:U(),sku:id,g:+size.value,n:+qty.value});cm('addM');plan()}function saveSet(){S.set={target:+target.value||80,maxDays:+maxDays.value||14,wmin:+wmin.value||2,wmax:+wmax.value||3,maxOpen:+maxOpen.value||2};plan()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='gulu_backup_'+T()+'.json';a.click()}async function load(e){try{let x=JSON.parse(await e.target.files[0].text());if(x.set&&x.cat)S=x;else if(x.activeCatId&&x.pantry?.[x.activeCatId]){let z=def();z.batches=x.pantry[x.activeCatId].map(b=>({id:b.id||U(),sku:b.canId,g:+b.grams,n:+b.count}));S=z}else throw Error('不支持');plan()}catch(e){alert('导入失败：'+e.message)}}function reset(){if(confirm('恢复内置数据？')){S=def();plan()}}function cm(id){document.getElementById(id).classList.remove('on')}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.p).classList.add('on');render()});if(!S.plan.length)plan();else render();
</script></body></html>
